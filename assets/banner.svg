<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="bar-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bar-grad-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bar-grad-4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #334155;
      stroke-width: 0.5;
      stroke-opacity: 0.25;
    }
    .pulsing-orb {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite alternate;
    }
    @keyframes pulseOrb {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.25; }
      100% { transform: scale(1.15) translate(20px, -15px); opacity: 0.5; }
    }
    .chart-bar {
      transform-origin: bottom;
      animation: growBar 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .b1 { animation-delay: 0.1s; }
    .b2 { animation-delay: 0.4s; }
    .b3 { animation-delay: 0.7s; }
    .b4 { animation-delay: 1.0s; }
    .b5 { animation-delay: 1.3s; }
    .b6 { animation-delay: 1.6s; }

    @keyframes growBar {
      0% { transform: scaleY(0.7); }
      100% { transform: scaleY(1.05); }
    }

    .wave-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawLine 6s ease-in-out infinite alternate;
    }
    @keyframes drawLine {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    .node-pulse {
      animation: nodePulse 2.5s infinite;
    }
    @keyframes nodePulse {
      0%, 100% { r: 4px; opacity: 0.6; }
      50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }

    .badge-pill {
      animation: floatBadge 4s ease-in-out infinite alternate;
    }
    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid lines for modern data dashboard feel -->
  <g class="bg-grid">
    <line x1="50" y1="60" x2="1150" y2="60" />
    <line x1="50" y1="120" x2="1150" y2="120" />
    <line x1="50" y1="180" x2="1150" y2="180" />
    <line x1="50" y1="240" x2="1150" y2="240" />
    <line x1="50" y1="300" x2="1150" y2="300" />
    <line x1="200" y1="40" x2="200" y2="320" />
    <line x1="400" y1="40" x2="400" y2="320" />
    <line x1="600" y1="40" x2="600" y2="320" />
    <line x1="800" y1="40" x2="800" y2="320" />
    <line x1="1000" y1="40" x2="1000" y2="320" />
  </g>

  <!-- Dynamic ambient glowing orbs in the background -->
  <circle cx="1000" cy="120" r="130" fill="#6366f1" class="pulsing-orb" opacity="0.25" filter="url(#glow)" />
  <circle cx="820" cy="240" r="100" fill="#38bdf8" class="pulsing-orb" opacity="0.2" filter="url(#glow)" style="animation-delay: -3s;" />
  <circle cx="150" cy="280" r="110" fill="#a855f7" class="pulsing-orb" opacity="0.15" filter="url(#glow)" style="animation-delay: -1.5s;" />

  <!-- Animated Analytics Graphic on the Right (Safely decoupled from text) -->
  <g transform="translate(740, 70)">
    <!-- Dashboard card background -->
    <rect x="0" y="0" width="410" height="230" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />

    <!-- Mini header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="24" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="24" r="5" fill="#10b981" opacity="0.8" />
    <text x="80" y="28" fill="#94a3b8" font-size="12" font-family="monospace">bi_metrics_stream.sql</text>

    <!-- Bar chart elements with animated growth -->
    <g transform="translate(30, 200)">
      <rect class="chart-bar b1" x="0" y="-85" width="22" height="85" rx="4" fill="url(#bar-grad-1)" />
      <rect class="chart-bar b2" x="35" y="-120" width="22" height="120" rx="4" fill="url(#bar-grad-2)" />
      <rect class="chart-bar b3" x="70" y="-70" width="22" height="70" rx="4" fill="url(#bar-grad-1)" />
      <rect class="chart-bar b4" x="105" y="-145" width="22" height="145" rx="4" fill="url(#bar-grad-3)" />
      <rect class="chart-bar b5" x="140" y="-110" width="22" height="110" rx="4" fill="url(#bar-grad-2)" />
      <rect class="chart-bar b6" x="175" y="-165" width="22" height="165" rx="4" fill="url(#bar-grad-4)" />
    </g>

    <!-- Trend line overlay with animated draw -->
    <path class="wave-line" d="M 40 135 Q 85 95, 125 125 T 195 70 T 265 100 T 345 45" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#soft-glow)" />

    <!-- Data nodes on trendline -->
    <circle class="node-pulse" cx="40" cy="135" r="5" fill="#ffffff" />
    <circle class="node-pulse" cx="125" cy="125" r="5" fill="#ffffff" style="animation-delay: 0.5s;" />
    <circle class="node-pulse" cx="195" cy="70" r="5" fill="#ffffff" style="animation-delay: 1.0s;" />
    <circle class="node-pulse" cx="265" cy="100" r="5" fill="#ffffff" style="animation-delay: 1.5s;" />
    <circle class="node-pulse" cx="345" cy="45" r="5" fill="#ffffff" style="animation-delay: 2.0s;" />

    <!-- Metric Pill Top Right -->
    <g class="badge-pill" transform="translate(260, 160)">
      <rect width="125" height="42" rx="8" fill="#1e293b" fill-opacity="0.95" stroke="#4f46e5" stroke-width="1.2" />
      <text x="14" y="18" fill="#94a3b8" font-size="10" font-family="-apple-system, sans-serif">METRIC VELOCITY</text>
      <text x="14" y="34" fill="#38bdf8" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif">⚡ +99.4%</text>
    </g>
  </g>

  <!-- Foreground Content: Unobstructed Left & Center Area -->
  <g transform="translate(80, 0)">
    <!-- Small Category Pill -->
    <g class="badge-pill" transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="0.08em" font-family="-apple-system, sans-serif">ENTERPRISE &amp; OPEN SOURCE</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="142" fill="#ffffff" font-size="44" class="title-text">
      Awesome <tspan fill="url(#primary-grad)">Business Intelligence</tspan>
    </text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="0" y="182" fill="#cbd5e1" font-size="18" class="subtitle-text">
      Self-Service Analytics, Semantic Modeling &amp; Embedded Dashboards
    </text>

    <!-- Description / Feature Tagline -->
    <text x="0" y="218" fill="#94a3b8" font-size="14" class="subtitle-text">
      Curated ecosystem of enterprise SaaS leaders and high-impact open-source BI platforms
    </text>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 255)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="14" y="20" fill="#e2e8f0" font-size="12" font-family="-apple-system, sans-serif">📊 Dashboards</text>

      <!-- Badge 2 -->
      <rect x="132" y="0" width="135" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="146" y="20" fill="#e2e8f0" font-size="12" font-family="-apple-system, sans-serif">🧠 Semantic Layer</text>

      <!-- Badge 3 -->
      <rect x="279" y="0" width="135" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="293" y="20" fill="#e2e8f0" font-size="12" font-family="-apple-system, sans-serif">⚡ Real-time OLAP</text>

      <!-- Badge 4 -->
      <rect x="426" y="0" width="135" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="440" y="20" fill="#e2e8f0" font-size="12" font-family="-apple-system, sans-serif">🤖 Agentic BI &amp; AI</text>
    </g>
  </g>
</svg>
