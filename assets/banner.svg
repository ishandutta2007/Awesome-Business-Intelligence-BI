<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="bar-grad-1" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".9"/></linearGradient><linearGradient id="bar-grad-2" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".2"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".9"/></linearGradient><linearGradient id="bar-grad-3" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".2"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".9"/></linearGradient><linearGradient id="bar-grad-4" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".2"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(.9) translate(0,0);opacity:.25}}@keyframes growBar{0%{transform:scaleY(.7)}}@keyframes drawLine{0%{stroke-dashoffset:800}}@keyframes nodePulse{0%{r:4px;opacity:.6}50%{r:6.5px;opacity:1;filter:drop-shadow(0 0 6px #38bdf8)}}@keyframes floatBadge{0%{transform:translateY(0)}}.bg-grid{stroke:#334155;stroke-width:.5;stroke-opacity:.25}.pulsing-orb{transform-origin:center;animation:pulseOrb 6s ease-in-out infinite alternate}.chart-bar{transform-origin:bottom;animation:growBar 3.5s cubic-bezier(.4,0,.2,1) infinite alternate}.b1{animation-delay:.1s}.b2{animation-delay:.4s}.b3{animation-delay:.7s}.b4{animation-delay:1s}.b5{animation-delay:1.3s}.b6{animation-delay:1.6s}.wave-line{stroke-dasharray:800;stroke-dashoffset:800;animation:drawLine 6s ease-in-out infinite alternate}.node-pulse{animation:nodePulse 2.5s infinite}.badge-pill{animation:floatBadge 4s ease-in-out infinite alternate}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.03em}.subtitle-text{font-weight:400}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g class="bg-grid"><line x1="50" x2="1150" y1="60" y2="60"/><line x1="50" x2="1150" y1="120" y2="120"/><line x1="50" x2="1150" y1="180" y2="180"/><line x1="50" x2="1150" y1="240" y2="240"/><line x1="50" x2="1150" y1="300" y2="300"/><line x1="200" x2="200" y1="40" y2="320"/><line x1="400" x2="400" y1="40" y2="320"/><line x1="600" x2="600" y1="40" y2="320"/><line x1="800" x2="800" y1="40" y2="320"/><line x1="1000" x2="1000" y1="40" y2="320"/></g><circle cx="1000" cy="120" r="130" fill="#6366f1" class="pulsing-orb" filter="url(#glow)" opacity=".25"/><circle cx="820" cy="240" r="100" fill="#38bdf8" class="pulsing-orb" filter="url(#glow)" opacity=".2" style="animation-delay:-3s"/><circle cx="150" cy="280" r="110" fill="#a855f7" class="pulsing-orb" filter="url(#glow)" opacity=".15" style="animation-delay:-1.5s"/><g transform="translate(740, 70)"><rect width="410" height="230" x="0" y="0" fill="#0f172a" fill-opacity=".75" stroke="#334155" stroke-width="1.2" rx="12"/><circle cx="24" cy="24" r="5" fill="#ef4444" opacity=".8"/><circle cx="40" cy="24" r="5" fill="#f59e0b" opacity=".8"/><circle cx="